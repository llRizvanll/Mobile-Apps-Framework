name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify

  bundle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        brand: [acme, globex]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Metro bundle (${{ matrix.brand }})
        working-directory: apps/example
        run: npx expo export --platform ios --output-dir dist
        env:
          CI: 1
          EXPO_PUBLIC_BRAND: ${{ matrix.brand }}
