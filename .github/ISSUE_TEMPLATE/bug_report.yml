name: 🐛 Bug report
description: Something isn't working as documented
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check the [troubleshooting guide](https://llrizvanll.github.io/Mobile-Apps-Framework/troubleshooting) first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          foundation,
          di,
          observability,
          storage,
          network,
          state,
          i18n,
          theme,
          presentation,
          ui,
          ai,
          core,
          testing,
          brands,
          example app,
          generators,
          docs,
          other,
        ]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal snippet or failing test is ideal.
      render: tsx
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: 'iOS 19 simulator · Expo SDK 57 · RN 0.86 · Node 22 · brand: acme'
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
