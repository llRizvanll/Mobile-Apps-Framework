name: ✨ Feature request
description: Suggest a capability for the framework, brands or tooling
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API sketch welcome. Which package (layer) should own it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
